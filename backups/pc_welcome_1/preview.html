<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Welcome Screen Preset: pc_welcome_1 Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .welcome-vector-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center 42%, #0e1e38 0%, #081120 70%, #040812 100%);
      color: #ffffff;
      z-index: 99999;
      user-select: none;
    }

    .welcome-vector-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 680px;
      padding: 0 24px;
      transform: translateY(-3vh);
    }

    .welcome-alstom-brand {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
    }

    .alstom-vector-logo {
      width: 100%;
      height: auto;
      max-height: 96px;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.45));
    }

    .alstom-vector-o {
      filter: drop-shadow(0 0 10px rgba(224, 26, 34, 0.55));
    }

    .welcome-train-track {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .welcome-train-svg {
      width: 100%;
      height: 32px;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.65));
    }

    @keyframes trainDashProgress {
      0% {
        stroke-dashoffset: 650;
        opacity: 0.35;
      }
      25% {
        opacity: 0.75;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    .train-stroke-animated {
      stroke-dasharray: 650;
      stroke-dashoffset: 650;
      animation: trainDashProgress 5s cubic-bezier(0.2, 0.85, 0.25, 1) forwards;
    }

    @keyframes noseGlow {
      0%, 100% {
        r: 1.6;
        opacity: 0.8;
      }
      50% {
        r: 2.2;
        opacity: 1;
      }
    }

    .train-headlight {
      animation: noseGlow 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 5px #ffffff) drop-shadow(0 0 10px #38bdf8);
    }

    /* 3-Tier Bottom Anchor Signature: pc_welcome_1 */
    .welcome-vector-footer {
      position: absolute;
      bottom: clamp(28px, 6vh, 48px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .welcome-footer-by {
      font-style: normal;
      font-weight: 400;
      font-size: clamp(14px, 1.2vw, 17px);
      color: #64748b;
      opacity: 0.65;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .welcome-footer-team {
      font-style: normal;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: clamp(17px, 1.4vw, 22px);
      color: #e2e8f0;
      opacity: 0.9;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
      margin-bottom: 10px;
    }

    .welcome-footer-version {
      font-style: normal;
      font-weight: 400;
      font-size: clamp(12px, 0.95vw, 14px);
      color: #475569;
      opacity: 0.65;
      letter-spacing: 0.08em;
    }

    /* Preset Tag Pill */
    .preset-pill {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="welcome-vector-stage">
    <div class="preset-pill">Preset: pc_welcome_1</div>

    <div class="welcome-vector-center">
      <!-- Official ALSTOM Vector Logo -->
      <div class="welcome-alstom-brand" title="ALSTOM" aria-label="ALSTOM">
        <svg class="alstom-vector-logo" viewBox="20 18 292 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ALSTOM">
          <path fill="#FFFFFF" d="M89.217,23.185H78.221V67.77h31.147v-8.66h-20.15V23.185z M40.252,23.185L23.185,67.77h10.646c1.938-6.624,10.381-11.63,18.242-12.328l-1.62-4.035c-3.306-0.434-8.164,0.096-11.11,1.373l7.195-18.863L60.482,67.77H71.11L52.747,23.185H40.252z M151.013,31.814h14.654V67.77h11.267V31.814h14.726v-8.63h-40.646V31.814z M296.861,23.185L283.986,40.13l-12.688-16.945h-9.885V67.77h11.265V40.528l10.551,14.41h1.607l10.533-14.41V67.77h11.279V23.185H296.861z M123.995,34.623c0-3.583,8.13-6.704,20.81-2.149l0.737-8.803c-2.007-0.886-7.694-2.373-12.028-2.373c-9.237,0-19.708,3.401-19.708,14.481c0,16.612,24.791,10.929,24.083,19.996c-0.276,3.52-5.524,4.375-9.957,4.375c-5.039,0-9.569-1.004-12.635-2.461l-1.052,9.564c4.091,1.32,9.406,1.971,13.687,1.971c10.218,0,20.198-3.22,20.24-15.138C148.191,38.161,123.995,42.795,123.995,34.623z"/>
          <path class="alstom-vector-o" fill="#E01A22" d="M250.891,31.493l-2.798,2.97c4.517,7.097,5.144,16.161,0.952,23.733l1.533-0.026C255.788,49.715,255.71,39.556,250.891,31.493z M238.625,33.199l1.52-1.6c-7.59-7.025-20.177-6.867-27.506,0.666c-4.367,4.483-6.427,10.485-5.434,16.14l1.527-0.047c0.087-7.89,6.538-14.389,14.675-14.57c8.314-0.229,15.218,6.142,15.394,14.252c0.223,8.131-6.3,14.85-14.606,15.072c-4.174,0.102-7.955-1.441-10.746-4.001l-2.159,2.215c-9.611-8.874-9.979-23.694-0.892-33.029c7.334-7.545,18.562-9.264,27.651-5.06l0.119,0.134l1.168-1.302c-11.564-6.719-26.828-4.807-36.562,5.194c-11.502,11.788-10.973,30.411,1.13,41.594l2.183-2.224c4.78,4.38,10.334,6.573,16.817,6.39c13.078-0.346,23.406-10.941,23.076-23.671C245.811,42.956,243.007,37.239,238.625,33.199z"/>
        </svg>
      </div>

      <!-- Aerodynamic Bullet Train Loader (Tail at x=8, Head at x=508) -->
      <div class="welcome-train-track" aria-hidden="true">
        <svg class="welcome-train-svg" viewBox="0 0 520 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="trainNeonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
              <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.7"/>
              <stop offset="85%" stop-color="#38bdf8" stop-opacity="1"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
            </linearGradient>
            <clipPath id="trainProgressClip">
              <rect class="train-progress-clip-rect" x="0" y="0" width="520" height="28"/>
            </clipPath>
          </defs>

          <!-- Rail Track -->
          <line x1="0" y1="24" x2="510" y2="24" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" stroke-linecap="round"/>

          <!-- Speed Streaks -->
          <g class="train-speed-streaks">
            <line class="train-speed-streak s1" x1="-30" y1="12" x2="160" y2="12" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
            <line class="train-speed-streak s2" x1="-15" y1="16" x2="200" y2="16" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
            <line class="train-speed-streak s3" x1="10" y1="20" x2="250" y2="20" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
          </g>

          <!-- Faint Wireframe Body -->
          <g stroke="rgba(56, 189, 248, 0.28)" fill="none">
            <path d="M8 12 H395 C430 12 465 14.5 488 19 C498 21 504 22.5 508 23.5 L485 24 H8 Z" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M462 14.5 C474 16 484 18 492 20 L484 21.2 H456 Z" stroke-width="1" fill="rgba(56, 189, 248, 0.08)"/>
            <line x1="16" y1="16" x2="445" y2="16" stroke-width="1.1" stroke-dasharray="24 6"/>
            <rect x="430" y="13.5" width="10" height="10" rx="1" stroke-width="1"/>
            <path d="M45 24 C45 22.5 53 22.5 53 24 M70 24 C70 22.5 78 22.5 78 24 M110 24 C110 22.5 118 22.5 118 24 M135 24 C135 22.5 143 22.5 143 24 M175 24 C175 22.5 183 22.5 183 24 M200 24 C200 22.5 208 22.5 208 24 M230 24 C230 22.5 238 22.5 238 24 M255 24 C255 22.5 263 22.5 263 24 M360 24 C360 22.5 368 22.5 368 24 M385 24 C385 22.5 393 22.5 393 24" stroke-width="1.2"/>
          </g>

          <!-- Animated Neon Energy Stroke (5 seconds) -->
          <path class="train-stroke-animated" d="M8 12 H395 C430 12 465 14.5 488 19 C498 21 504 22.5 508 23.5 L485 24 H8 Z" stroke="url(#trainNeonGrad)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <path class="train-stroke-animated" d="M462 14.5 C474 16 484 18 492 20 L484 21.2 H456 Z" stroke="#38bdf8" stroke-width="1.2" fill="rgba(56, 189, 248, 0.3)"/>
          <line class="train-stroke-animated" x1="16" y1="16" x2="445" y2="16" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="24 6"/>
          <line class="train-stroke-animated" x1="0" y1="24" x2="510" y2="24" stroke="url(#trainNeonGrad)" stroke-width="1.6" stroke-linecap="round"/>
          <circle class="train-headlight" cx="506" cy="23" r="1.6" fill="#FFFFFF"/>
        </svg>
      </div>
    </div>

    <!-- 3-Tier Bottom Anchor Signature -->
    <div class="welcome-vector-footer" aria-label="by IXL Team 1.0.0">
      <div class="welcome-footer-by">by</div>
      <div class="welcome-footer-team">IXL Team</div>
      <div class="welcome-footer-version">1.0.0</div>
    </div>
  </div>
</body>
</html>
