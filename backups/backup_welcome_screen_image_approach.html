<!--
  BACKUP ARCHIVE: Old Welcome Screen Based on Image Approach
  Created: 2026-11-12
  Purpose: Preserves the original image-based PC & Mobile welcome screen markup and CSS
           for quick restoration if ever needed.
-->

<!-- Original Critical CSS for Image-Based Welcome Screen -->
<style id="backupImageLaunchCritical">
  #mobileWelcomeOverlay:not(.hidden-permanently):not(.hidden) {
    display: flex !important;
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    z-index: 999999 !important;
    background: #010612 !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
    cursor: pointer;
  }
  #mobileWelcomeOverlay.hidden,
  #mobileWelcomeOverlay.hidden-permanently {
    display: none !important;
    pointer-events: none !important;
  }
  #mobileWelcomeOverlay.fade-out {
    opacity: 0 !important;
    pointer-events: none !important;
    transition: opacity 0.4s ease-out !important;
  }
  .welcome-splash-stage {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: #010612 !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .welcome-artwork-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw !important;
    width: 100% !important;
    height: 100vh !important;
    height: 100dvh !important;
    height: 100% !important;
    max-width: 100vw !important;
    max-height: 100vh !important;
    max-height: 100dvh !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #010612 !important;
    overflow: hidden;
    aspect-ratio: auto;
  }
  .welcome-splash-picture {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }
  .welcome-splash-artwork {
    width: 100vw !important;
    width: 100% !important;
    height: 100vh !important;
    height: 100dvh !important;
    height: 100% !important;
    object-fit: cover !important;
    object-position: center !important;
    display: block;
    margin: 0 auto;
    background: #010612;
  }
  .splash-spinner-wrap {
    position: absolute;
    top: 90.0%;
    left: 50.4%;
    transform: translate(-50%, -50%);
    width: clamp(24px, 3.2vw, 44px);
    height: clamp(24px, 3.2vw, 44px);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }
  .splash-spinner-circle {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.18);
    border-top-color: #38bdf8;
    border-right-color: #0284c7;
    animation: splashSpinnerSpin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
  }
  @keyframes splashSpinnerSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<!-- Original Markup for Image-Based Welcome Screen -->
<div id="backupMobileWelcomeOverlay" class="mobile-welcome-overlay" aria-modal="true" role="dialog" aria-label="Alstom IXL Launch Screen" onclick="this.classList.add('fade-out'); var self = this; setTimeout(function(){ self.classList.add('hidden-permanently', 'hidden'); self.style.display='none'; }, 400);">
  <div class="welcome-splash-stage">
    <div class="welcome-artwork-wrapper">
      <picture class="welcome-splash-picture">
        <source media="(max-width: 768px)" srcset="alstom-welcome-mobile.jpg?v=10.0" width="1408" height="3040">
        <source media="(min-width: 769px)" srcset="alstom-welcome-pc.jpg?v=10.0" width="2752" height="1536">
        <img src="alstom-welcome-pc.jpg?v=10.0" alt="Alstom - mobility by nature - by IXL Team" class="welcome-splash-artwork" width="2752" height="1536" loading="eager" decoding="sync">
      </picture>
      <!-- Dynamic Rotating Loading Circle slightly above 'by' text -->
      <div class="splash-spinner-wrap" aria-hidden="true">
        <div class="splash-spinner-circle"></div>
      </div>
    </div>
  </div>

  <!-- Hidden Accessible Elements to Preserve Brand & Test Contracts -->
  <div class="sr-only" id="mobileWelcomeLogo" title="ALSTOM" aria-label="ALSTOM">
    <img src="alstom-logo-light.png" alt="ALSTOM" class="welcome-wordmark brand-wordmark-light" width="220" height="43">
    <img src="alstom-logo-dark.png" alt="ALSTOM" class="welcome-wordmark brand-wordmark-dark" width="220" height="43">
  </div>

  <div class="mobile-launch-footer sr-only" id="mobileLaunchFooter" aria-label="by IXL Team">
    <div class="launch-footer-sub">by</div>
    <div class="launch-footer-brand">IXL Team</div>
  </div>

  <!-- Hidden Accessible / Test Button -->
  <button type="button" class="sr-only" id="mobileWelcomeEnterBtn" aria-label="Open Mobile Editor">
    Open Mobile Editor
  </button>
</div>
